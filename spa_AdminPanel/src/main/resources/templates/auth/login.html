<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Iniciar Sesión - Spa Sowa Ta'a</title>
</head>
<body>
<section class="auth-wrapper">
    <div class="card auth-card">
        <div class="section-banner">
            <h2>Iniciar Sesión</h2>
        </div>
        <form th:action="@{/login}" method="post" class="form-stack">
            <div class="form-group">
                <label for="username">Correo electrónico</label>
                <input type="email" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>
        <p class="auth-footer">
            ¿No tienes cuenta? <a th:href="@{/registro}" class="link-accent">Regístrate aquí</a>
        </p>
    </div>
</section>
</body>
</html>
